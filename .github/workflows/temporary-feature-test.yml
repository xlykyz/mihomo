name: Temporary Feature Test

on:
  push:
    branches:
      - main

jobs:
  test-feature:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      SKIP_INTEROP_TEST: 1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/multi-target-health-check
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'
      - name: Verify Go
        run: go version
      - name: Test outboundgroup
        run: go test ./adapter/outboundgroup -v -count=1
      - name: Full test
        run: go test ./... -v -count=1
